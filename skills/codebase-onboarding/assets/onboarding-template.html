<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__ONB_TITLE__</title>
<style>
  /* Catppuccin Mocha only. One hue means one thing on nodes and edges alike;
     the meaning table is the onb-kinds JSON block below, which the build
     script also validates models against. */
  :root {
    --rosewater: #f5e0dc; --flamingo: #f2cdcd; --pink: #f5c2e7; --mauve: #cba6f7;
    --red: #f38ba8; --maroon: #eba0ac; --peach: #fab387; --yellow: #f9e2af;
    --green: #a6e3a1; --teal: #94e2d5; --sky: #89dceb; --sapphire: #74c7ec;
    --blue: #89b4fa; --lavender: #b4befe; --text: #cdd6f4; --subtext1: #bac2de;
    --subtext0: #a6adc8; --overlay2: #9399b2; --overlay1: #7f849c; --overlay0: #6c7086;
    --surface2: #585b70; --surface1: #45475a; --surface0: #313244; --base: #1e1e2e;
    --mantle: #181825; --crust: #11111b;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--base); color: var(--text); font: 14px/1.5 var(--sans); }
  a { color: var(--sapphire); }
  code, pre { font-family: var(--mono); }
  button { font: inherit; color: inherit; }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header.top { padding: 12px 16px 0; background: var(--mantle); border-bottom: 1px solid var(--surface0); }
  .title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .title-row h1 { margin: 0; font-size: 18px; font-weight: 650; }
  .meta { color: var(--overlay1); font: 12px var(--mono); }
  .summary { margin: 4px 0 8px; color: var(--subtext0); max-width: 110ch; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px;
         color: var(--subtext0); cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--mauve); }
  .tab .tab-kind { font-size: 11px; color: var(--overlay1); margin-left: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; padding-bottom: 6px; align-items: center; }
  .btn { background: var(--surface0); border: 1px solid var(--surface1); border-radius: 6px;
         padding: 3px 9px; cursor: pointer; font-size: 13px; }
  .btn:hover:not(:disabled) { background: var(--surface1); }
  .btn:disabled { opacity: .4; cursor: default; }
  .tour-label { font: 12px var(--mono); color: var(--subtext0); min-width: 9ch; text-align: center; }
  .search { background: var(--crust); border: 1px solid var(--surface1); border-radius: 6px;
            color: var(--text); padding: 3px 9px; width: 180px; font: 13px var(--sans); }
  .search:focus { outline: 1px solid var(--mauve); }

  /* Both side panels share one width and collapse to the same slim rail. */
  .body { --panel: 320px; --rail: 40px; --left: var(--panel); --right: var(--panel);
          display: grid; grid-template-columns: var(--left) minmax(0, 1fr) var(--right); min-height: 0; }
  .body.left-collapsed { --left: var(--rail); }
  .body.right-collapsed { --right: var(--rail); }
  aside { background: var(--mantle); min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  aside.legend { border-right: 1px solid var(--surface0); }
  aside.details { border-left: 1px solid var(--surface0); }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px;
                border-bottom: 1px solid var(--surface0); }
  aside.details .panel-head { flex-direction: row-reverse; padding: 8px 16px 8px 10px; }
  .panel-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--subtext0);
                 font-weight: 600; flex: 1; }
  aside.details .panel-title { text-align: right; }
  .panel-toggle { background: none; border: 1px solid transparent; border-radius: 6px; width: 26px; height: 26px;
                  cursor: pointer; color: var(--overlay2); display: grid; place-items: center; flex: none; }
  .panel-toggle:hover, .panel-toggle:focus-visible { color: var(--text); background: var(--surface0); outline: none; border-color: var(--surface1); }
  .panel-body { overflow-y: auto; padding: 12px 16px; min-height: 0; flex: 1; }
  aside.collapsed .panel-body { display: none; }
  aside.collapsed .panel-head { flex-direction: column; padding: 8px 0; border: 0; height: 100%; cursor: pointer; }
  aside.collapsed .panel-title { writing-mode: vertical-rl; text-align: start; flex: none; }
  aside.legend.collapsed .panel-title { transform: rotate(180deg); }
  aside h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--overlay1);
             margin: 14px 0 6px; font-weight: 600; }
  .panel-body h2:first-child { margin-top: 0; }
  .view-summary { color: var(--subtext0); font-size: 13px; margin: 0 0 4px; }
  .legend-item { display: grid; grid-template-columns: 46px 1fr; gap: 8px; align-items: center;
                 padding: 5px 6px; border-radius: 6px; cursor: default; }
  .legend-item:hover, .legend-item:focus { background: var(--surface0); outline: none; }
  .legend-item svg { width: 46px; height: 30px; overflow: visible; }
  .legend-name { font-weight: 600; font-size: 13px; }
  .legend-def { display: block; color: var(--subtext0); font-size: 12px; line-height: 1.35; }
  .keys { color: var(--subtext0); font-size: 12px; line-height: 1.8; }
  kbd { font: 11px var(--mono); background: var(--surface0); border: 1px solid var(--surface1);
        border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

  .canvas-wrap { position: relative; min-height: 0; overflow: hidden; background:
    radial-gradient(circle, var(--surface0) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--base); }
  svg.canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
  svg.canvas.panning { cursor: grabbing; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }

  .group-box { fill: var(--mantle); stroke: var(--surface1); stroke-width: 1.5; }
  .group-box.module { stroke-dasharray: 7 5; }
  .group-box.outside { stroke-dasharray: 2 5; fill: transparent; }
  .group-head { fill: var(--crust); }
  .group-dir { fill: var(--overlay1); font: 12px var(--mono); }
  .group-file { fill: var(--text); font: 600 12px var(--mono); }
  .group-lang { fill: var(--overlay2); font: 10px var(--mono); }
  .group-lang-bg { fill: var(--surface0); }
  .group:hover .group-box { stroke: var(--surface2); }

  .node { cursor: pointer; outline: none; }
  .node .shape { stroke-width: 1.8; }
  .node .label { fill: var(--text); font: 500 13px var(--sans); pointer-events: none; }
  .node .badge circle { fill: var(--crust); stroke-width: 1.5; }
  .node .badge text { fill: var(--text); font: 700 11px var(--mono); pointer-events: none; }
  .node:hover .shape, .node:focus-visible .shape, .node.selected .shape { stroke-width: 3; }
  .node.selected .shape { filter: drop-shadow(0 0 6px currentColor); }
  .node.match .shape { stroke-dasharray: 5 3; stroke-width: 3; }
  .node .drill { fill: var(--overlay2); font: 11px var(--sans); pointer-events: none; }

  .edge path.line { fill: none; }
  .edge path.hit { fill: none; stroke: transparent; stroke-width: 14; cursor: help; }
  .edge .edge-label rect { fill: var(--base); stroke: var(--surface1); }
  .edge .edge-label text { font: 11px var(--sans); fill: var(--subtext1); }
  .edge:hover path.line { stroke-width: 3; }

  .dimming .node:not(.lit), .dimming .edge:not(.lit), .dimming .group:not(.lit) { opacity: .16; }
  .node, .edge, .group { transition: opacity .12s; }

  .tip { position: absolute; z-index: 5; max-width: min(600px, 92vw); background: var(--crust);
         border: 1px solid var(--surface1); border-radius: 10px; padding: 10px 12px;
         box-shadow: 0 10px 30px rgba(0,0,0,.45); pointer-events: auto; user-select: text; }
  .tip[hidden] { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font: 600 11px var(--sans);
          padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .card-title { font-weight: 650; font-size: 15px; margin: 6px 0 2px; }
  .card-summary { color: var(--subtext1); margin: 0 0 8px; }
  .card-summary code, .view-summary code, .summary code { background: var(--surface0); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  .loc { font: 12px var(--mono); color: var(--overlay2); margin-bottom: 4px; display: block; }
  pre.code { margin: 0; background: var(--base); border: 1px solid var(--surface0); border-radius: 8px;
             padding: 8px 0; overflow-x: auto; font-size: 12px; line-height: 1.55; }
  pre.code .ln { display: inline-block; width: 4.5ch; padding-right: 1ch; margin-right: 1ch; text-align: right;
                 color: var(--surface2); border-right: 1px solid var(--surface0); user-select: none; }
  pre.code .row { display: block; padding-right: 12px; white-space: pre; }
  .t-comment { color: var(--overlay0); font-style: italic; }
  .t-string { color: var(--green); }
  .t-keyword { color: var(--mauve); }
  .t-builtin { color: var(--red); }
  .t-number { color: var(--peach); }
  .t-type { color: var(--yellow); }
  .t-function { color: var(--blue); }
  .t-property { color: var(--lavender); }
  .t-key { color: var(--blue); }
  .t-decorator { color: var(--peach); }
  .t-variable { color: var(--flamingo); }
  .t-operator { color: var(--sky); }
  .t-punct { color: var(--overlay2); }

  .details .empty { color: var(--overlay1); font-size: 13px; }
  .conn-list { list-style: none; padding: 0; margin: 4px 0 0; }
  .conn-list li { margin: 3px 0; }
  .conn { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; background: var(--surface0);
          border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 13px; }
  .conn:hover { border-color: var(--surface2); }
  .conn .conn-label { color: var(--subtext0); font-size: 12px; margin-left: auto; }
  .drill-btn { margin-top: 10px; width: 100%; padding: 6px; }

  @media (max-width: 1000px) {
    .app { height: auto; }
    .body, .body.left-collapsed, .body.right-collapsed { grid-template-columns: minmax(0, 1fr); }
    aside.collapsed .panel-head { flex-direction: row; padding: 8px 16px; height: auto; }
    aside.details.collapsed .panel-head { flex-direction: row-reverse; }
    aside.collapsed .panel-title { writing-mode: horizontal-tb; transform: none !important; }
    .canvas-wrap { height: 72vh; order: 1; }
    aside.details { order: 2; border: 0; border-top: 1px solid var(--surface0); }
    aside.legend { order: 3; border: 0; border-top: 1px solid var(--surface0); }
    .controls { margin-left: 0; }
    .search { width: 140px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title-row">
      <h1 id="title"></h1>
      <span class="meta" id="meta"></span>
    </div>
    <p class="summary" id="summary"></p>
    <div class="toolbar">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
      <div class="controls">
        <input class="search" id="search" type="search" placeholder="Search  /" aria-label="Search nodes">
        <button class="btn" id="prev" title="Previous step (←)">◀</button>
        <span class="tour-label" id="tour-label"></span>
        <button class="btn" id="next" title="Next step (→)">▶</button>
      </div>
    </div>
  </header>
  <div class="body">
    <aside class="legend" id="legend-panel" aria-label="Legend">
      <div class="panel-head">
        <span class="panel-title">Legend</span>
        <button class="panel-toggle" id="legend-toggle" aria-controls="legend" aria-expanded="true" title="Collapse legend ([)">«</button>
      </div>
      <div class="panel-body" id="legend"></div>
    </aside>
    <div class="canvas-wrap" id="wrap">
      <svg class="canvas" id="canvas" role="img" aria-label="Flow diagram">
        <defs id="defs"></defs>
        <g id="viewport"></g>
      </svg>
      <div class="zoom">
        <button class="btn" id="zoom-out" title="Zoom out (-)">−</button>
        <button class="btn" id="zoom-fit" title="Fit (f)">Fit</button>
        <button class="btn" id="zoom-in" title="Zoom in (+)">+</button>
      </div>
      <div class="tip" id="tip" hidden role="tooltip"></div>
    </div>
    <aside class="details" id="details-panel" aria-label="Details">
      <div class="panel-head">
        <span class="panel-title">Details</span>
        <button class="panel-toggle" id="details-toggle" aria-controls="details" aria-expanded="true" title="Collapse details (])">»</button>
      </div>
      <div class="panel-body" id="details" aria-live="polite"></div>
    </aside>
  </div>
</div>

<script type="application/json" id="onb-kinds">
{
  "nodes": {
    "entry":     {"label": "Entry point", "shape": "stadium",       "color": "green",    "definition": "Where control enters: route, CLI command, main, event handler, exported API."},
    "step":      {"label": "Step",        "shape": "rounded",       "color": "blue",     "definition": "A function or block doing ordinary work: validate, transform, compute."},
    "decision":  {"label": "Decision",    "shape": "diamond",       "color": "yellow",   "definition": "A branch that changes the path; its yellow arrows are the outcomes."},
    "store":     {"label": "Data store",  "shape": "cylinder",      "color": "peach",    "definition": "State that outlives the call: database, file, cache, session."},
    "external":  {"label": "External",    "shape": "hexagon",       "color": "mauve",    "definition": "Outside this repo: HTTP API, SDK, OS process, another service."},
    "async":     {"label": "Async",       "shape": "parallelogram", "color": "teal",     "definition": "Work that continues later or elsewhere: queue, event, task, callback."},
    "config":    {"label": "Config",      "shape": "note",          "color": "lavender", "definition": "Settings that shape behaviour: env vars, config files, flags."},
    "exit":      {"label": "Success exit","shape": "stadium2",      "color": "pink",     "definition": "Where the flow ends successfully: response sent, value returned."},
    "error":     {"label": "Failure",     "shape": "octagon",       "color": "red",      "definition": "Where the flow ends in failure: exception, error response, non-zero exit."},
    "component": {"label": "Component",   "shape": "component",     "color": "sapphire", "definition": "A module, package or service treated as one unit (architecture views)."}
  },
  "edges": {
    "call":    {"label": "Calls",       "dash": "",      "head": "triangle", "color": "subtext0", "width": 1.8, "definition": "Synchronous call or hand-off: A invokes B and waits."},
    "return":  {"label": "Returns",     "dash": "",      "head": "chevron",  "color": "overlay2", "width": 1.2, "definition": "A value flowing back to the caller."},
    "branch":  {"label": "Branch",      "dash": "",      "head": "triangle", "color": "yellow",   "width": 1.8, "definition": "One outcome of a decision; the label names the condition."},
    "async":   {"label": "Async",       "dash": "7 5",   "head": "triangle", "color": "teal",     "width": 1.8, "definition": "Fire-and-forget: publish, enqueue, schedule. The caller does not wait."},
    "data":    {"label": "Reads/writes","dash": "1.5 5", "head": "dot",      "color": "peach",    "width": 2.2, "definition": "Reads from or writes to a data store."},
    "error":   {"label": "Error path",  "dash": "7 5",   "head": "triangle", "color": "red",      "width": 1.8, "definition": "Failure propagating: raise, throw, reject, error response."},
    "depends": {"label": "Depends on",  "dash": "12 6",  "head": "chevron",  "color": "overlay1", "width": 1.4, "definition": "Build-time dependency: A imports or requires B (architecture views)."}
  },
  "groups": {
    "file":    {"label": "File",         "definition": "Every step inside comes from this one file."},
    "module":  {"label": "Module",       "definition": "A directory or package; steps may come from any file in it."},
    "outside": {"label": "Outside repo", "definition": "Callers and services with no source in this repo."}
  }
}
</script>
<script type="application/json" id="onb-model">__ONB_MODEL__</script>
<script>
(() => {
  "use strict";
  const KINDS = JSON.parse(document.getElementById("onb-kinds").textContent);
  const MODEL = JSON.parse(document.getElementById("onb-model").textContent);
  const SVG = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const cssVar = (name) => `var(--${name})`;

  // ---------- small DOM helpers (never innerHTML with model data) ----------
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "style") node.style.cssText = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) if (c != null) node.append(c);
    return node;
  }
  function sv(tag, attrs = {}, ...children) {
    const node = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs)) if (v != null) node.setAttribute(k, v);
    for (const c of children.flat()) if (c != null) node.append(c);
    return node;
  }
  // Inline `code` spans inside prose; everything else stays literal text.
  function prose(tag, cls, text) {
    const node = el(tag, { class: cls });
    String(text || "").split(/(`[^`]+`)/).forEach((part) => {
      if (/^`[^`]+`$/.test(part)) node.append(el("code", {}, part.slice(1, -1)));
      else if (part) node.append(part);
    });
    return node;
  }

  // ---------- syntax highlighting (local, Catppuccin token colours) ----------
  const WORDS = {
    python: ["and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case", "True False None self cls print len range dict list set tuple str int float bool isinstance super type open Exception ValueError"],
    javascript: ["async await break case catch class const continue default delete do else export extends finally for from function if import in instanceof let new of return static super switch this throw try typeof var void while yield", "true false null undefined console Promise Object Array JSON Map Set Error Math Number String document window require module process"],
    typescript: ["abstract as async await break case catch class const continue declare default delete do else enum export extends finally for from function if implements import in instanceof interface keyof let namespace new of private protected public readonly return satisfies static super switch this throw try type typeof var void while yield", "true false null undefined console Promise Object Array JSON Map Set Error Math Number String Record Partial string number boolean unknown any never"],
    go: ["break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var", "true false nil iota append cap close copy delete len make new panic print println recover error string int int64 bool byte rune float64 any"],
    rust: ["as async await break const continue crate dyn else enum extern fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait type unsafe use where while", "true false Some None Ok Err Box Vec String Option Result println format vec panic i32 i64 u8 u32 u64 usize f64 bool str"],
    shell: ["if then else elif fi for while until do done case esac function in select return local export readonly declare set unset source exit", "echo printf cd test read shift true false"],
    java: ["abstract break case catch class continue default do else enum extends final finally for if implements import instanceof interface new package private protected public return static super switch this throw throws try void while var", "true false null String Integer List Map Optional System"],
    ruby: ["alias and begin break case class def do else elsif end ensure for if in module next nil not or redo rescue retry return self super then unless until when while yield", "true false puts require attr_accessor"],
    sql: ["select from where join left right inner outer on group by order having insert into values update set delete create table index primary key foreign references and or not null as limit offset union distinct returning", "count sum avg min max now coalesce"],
  };
  WORDS.tsx = WORDS.typescript; WORDS.jsx = WORDS.javascript; WORDS.kotlin = WORDS.java;
  WORDS.c = WORDS.cpp = WORDS.csharp = WORDS.swift = WORDS.java;
  const HASH_COMMENT = new Set(["python", "shell", "ruby", "yaml", "toml"]);
  const NO_COMMENT = new Set(["json"]);

  function tokenPattern(lang) {
    const comment = NO_COMMENT.has(lang) ? null
      : HASH_COMMENT.has(lang) ? "#[^\\n]*"
      : lang === "sql" ? "--[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/"
      : "\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/";
    const strings = [
      lang === "python" ? "[rRbBuUfF]{0,2}(?:\"\"\"[\\s\\S]*?\"\"\"|'''[\\s\\S]*?''')" : null,
      "[rRbBuUfF]{0,2}\"(?:\\\\.|[^\"\\\\\\n])*\"",
      lang === "rust" ? null : "'(?:\\\\.|[^'\\\\\\n])*'",
      ["javascript", "typescript", "jsx", "tsx", "go", "shell"].includes(lang) ? "`(?:\\\\.|[^`\\\\])*`" : null,
    ].filter(Boolean).join("|");
    const parts = [
      comment && `(?<comment>${comment})`,
      `(?<string>${strings})`,
      lang === "python" || lang === "java" || lang === "typescript" ? "(?<decorator>@[A-Za-z_][\\w.]*)" : null,
      lang === "shell" ? "(?<variable>\\$\\{?[A-Za-z_@#?*0-9][\\w]*\\}?)" : null,
      lang === "yaml" ? "(?<ykey>^[ \\t-]*[A-Za-z_][\\w.-]*(?=\\s*:))" : null,
      lang === "toml" ? "(?<section>^\\s*\\[[^\\]\\n]+\\])" : null,
      "(?<number>\\b(?:0x[\\da-fA-F]+|\\d[\\d_]*(?:\\.\\d+)?(?:e[+-]?\\d+)?)\\b)",
      "(?<property>(?<=\\.)[A-Za-z_$][\\w$]*)",
      "(?<word>[A-Za-z_$][\\w$]*!?)",
      "(?<operator>=>|->|::|===|!==|==|!=|<=|>=|&&|\\|\\||\\?\\?|:=|[-+*/%=<>!&|^~?])",
      "(?<punct>[()[\\]{}.,;:])",
    ].filter(Boolean);
    return new RegExp(parts.join("|"), "gm");
  }
  function classify(groups, text, lang, source, end) {
    if (groups.comment) return "comment";
    if (groups.string) return /^\s*:/.test(source.slice(end)) && (lang === "json" || lang === "yaml") ? "key" : "string";
    if (groups.decorator) return "decorator";
    if (groups.variable) return "variable";
    if (groups.ykey || groups.section) return "key";
    if (groups.number) return "number";
    if (groups.property) return /^\s*\(/.test(source.slice(end)) ? "function" : "property";
    if (groups.word) {
      const [kw, bi] = (WORDS[lang] || WORDS.javascript).map((s) => s.split(" "));
      const lower = lang === "sql" ? text.toLowerCase() : text;
      if (kw.includes(lower)) return "keyword";
      if (bi.includes(lower)) return "builtin";

  // ---------- layout: groups are columns, ranks are rows ----------
  const COL_GAP = 34, LANE_PAD = 16, LANE_GAP = 56, ROW_H = 140, HEAD_H = 34, MARGIN = 40;
  function layout(view) {

    view.edges.forEach((e) => out.get(e.from).push(e.to));
    // Break cycles with a DFS that starts from entries and low step numbers.
    const order = [...nodes].sort((a, b) => (a.kind === "entry" ? 0 : 1) - (b.kind === "entry" ? 0 : 1) || (a.step ?? 1e9) - (b.step ?? 1e9));
    const state = new Map(), back = new Set();

    const forward = view.edges.filter((e) => !back.has(`${e.from}>${e.to}`) && e.from !== e.to);
    // Longest-path ranks; a node never sits above a lower-numbered step.
    const rank = new Map(nodes.map((n) => [n.id, 0]));
    for (let pass = 0; pass < nodes.length + 1; pass++) {
      let changed = false;
      for (const e of forward) {

      }
      if (!changed) break;

    const rows = [...new Set(rank.values())].sort((a, b) => a - b);
    const rowOf = (id) => rows.indexOf(rank.get(id));

    const groups = new Map(view.groups.map((g) => [g.id, { ...g, members: [] }]));
    const OUT = "__outside__";
    for (const n of nodes) {
      const gid = n.group && groups.has(n.group) ? n.group : OUT;
      if (!groups.has(gid)) groups.set(gid, { id: OUT, kind: "outside", label: "Outside the repo", members: [] });
      groups.get(gid).members.push(n);
    }
    const lanes = [...groups.values()].filter((g) => g.members.length);
    const firstRow = (g) => Math.min(...g.members.map((n) => rowOf(n.id)));
    const firstStep = (g) => Math.min(...g.members.map((n) => n.step ?? 1e9));
    lanes.sort((a, b) => firstRow(a) - firstRow(b) || firstStep(a) - firstStep(b));

    // through many files stacks instead of drifting into a wide staircase.
    for (const lane of lanes) {
      const perRow = new Map();
      lane.members.sort((a, b) => (a.step ?? 1e9) - (b.step ?? 1e9));
      for (const n of lane.members) {
        const r = rowOf(n.id);
        perRow.set(r, (perRow.get(r) || 0) + 1);

      lane.perRow = perRow;
      lane.cols = Math.max(...perRow.values());

  function edgeGeometry(a, b, isBack, offset) {

      g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); } });

  // ---------- highlight / dim ----------
  function lightUp(nodeIds, edgeFilter) {

    root.classList.add("dimming");
    const lit = new Set(nodeIds || []);
    for (const { e, g } of els.edges) {
      const on = edgeFilter ? edgeFilter(e) : lit.has(e.from) && lit.has(e.to);
      g.classList.toggle("lit", on);
    }
    for (const [id, g] of els.nodes) g.classList.toggle("lit", lit.has(id));
    const nodeGroup = new Map(state.view.nodes.map((n) => [n.id, n.group && els.groups.has(n.group) ? n.group : "__outside__"]));
    const litGroups = new Set([...lit].map((id) => nodeGroup.get(id)));

  function hoverEdge(e) {
    if (e) lightUp([e.from, e.to], (x) => x === e);
    else restoreFocus();
  }
  function restoreFocus() {
    if (state.selected) lightUp(neighbourhood(state.selected), (e) => e.from === state.selected || e.to === state.selected);
    else lightUp(null);
  }

  // ---------- tooltip ----------
  let hideTimer = null;
  // Try right, left, below, above the anchor; take the first side where the
  // card fits without covering the anchor, else the side with the most room.
  function placeTip(anchorRect) {
    tip.hidden = false;
    const host = wrap.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 12, pad = 8;
    const a = { left: anchorRect.left - host.left, right: anchorRect.right - host.left,

    const clampX = (x) => Math.max(pad, Math.min(host.width - tw - pad, x));
    const clampY = (y) => Math.max(pad, Math.min(host.height - th - pad, y));
    const options = [
      { room: host.width - a.right - gap - pad, need: tw, pos: () => [a.right + gap, clampY(a.top)] },
      { room: a.left - gap - pad, need: tw, pos: () => [a.left - gap - tw, clampY(a.top)] },
      { room: host.height - a.bottom - gap - pad, need: th, pos: () => [clampX(a.left), a.bottom + gap] },
      { room: a.top - gap - pad, need: th, pos: () => [clampX(a.left), a.top - gap - th] },
    ];
    const pick = options.find((o) => o.room >= o.need) || options.reduce((best, o) => (o.room / o.need > best.room / best.need ? o : best));
    const [left, top] = pick.pos();
    tip.style.left = `${Math.max(pad, left)}px`;
    tip.style.top = `${Math.max(pad, top)}px`;
  }
  function kindChip(table, kind) {
    const spec = KINDS[table][kind] || {};

  }
  function showNodeTip(n) {
    clearTimeout(hideTimer);
    const view = state.view;
    const group = view.groups.find((g) => g.id === n.group);
    const body = [el("div", {}, kindChip("nodes", n.kind), n.step != null ? el("span", { class: "meta" }, `  step ${n.step}`) : null),
      el("div", { class: "card-title" }, n.label), prose("p", "card-summary", n.summary)];
    if (n.source) body.push(sourceLink(n.source), codeBlock(n.source));
    else if (group) body.push(el("span", { class: "loc" }, group.path || group.label));
    if (n.drill) body.push(el("div", { class: "meta", style: "margin-top:6px" }, "Double-click or use the details panel to open this flow."));
    tip.replaceChildren(...body);
    state.tipFor = { node: n.id };
    placeTip(els.nodes.get(n.id).getBoundingClientRect());
  }
  function showEdgeTip(e, ev) {
    clearTimeout(hideTimer);
    const nodes = new Map(state.view.nodes.map((n) => [n.id, n]));
    const spec = KINDS.edges[e.kind];
    tip.replaceChildren(el("div", {}, kindChip("edges", e.kind)),
      el("div", { class: "card-title" }, `${nodes.get(e.from).label} → ${nodes.get(e.to).label}`),
      e.label ? prose("p", "card-summary", e.label) : null,
      el("p", { class: "card-summary", style: "color:var(--overlay2);margin:0" }, spec.definition));
    state.tipFor = { edge: e };
    placeTip({ left: ev.clientX - 6, right: ev.clientX + 6, top: ev.clientY - 10, bottom: ev.clientY + 10 });
  }
  function hideTipSoon() { clearTimeout(hideTimer); hideTimer = setTimeout(hideTip, 220); }
  function hideTip() { tip.hidden = true; if (state.tipFor) { state.tipFor = null; hoverNode(null); } }
  // Keep the subject lit while the pointer reads or selects code in the card.
  tip.addEventListener("pointerenter", () => {
    clearTimeout(hideTimer);
    if (state.tipFor?.node) hoverNode(state.tipFor.node);
    else if (state.tipFor?.edge) hoverEdge(state.tipFor.edge);
  });
  tip.addEventListener("pointerleave", () => { hoverNode(null); hideTipSoon(); });

  // ---------- details panel ----------
  function renderDetails(id) {
    const panel = $("details");
    const view = state.view;
    if (!id) {
      panel.replaceChildren(el("h2", {}, view.title), prose("p", "view-summary", view.summary),
        el("h2", {}, "How to read this"),
        el("p", { class: "empty" }, "Hover any shape for its code. Click to pin it here. ",
          state.tour.length ? "Use ◀ ▶ or the arrow keys to walk the numbered steps in order." : "Nodes that say “open ⤵” lead to a detailed flow."));
      return;
    }
    const nodes = new Map(view.nodes.map((n) => [n.id, n]));
    const n = nodes.get(id);
    const group = view.groups.find((g) => g.id === n.group);
    const conn = (e, other) => el("li", {}, el("button", { class: "conn", onclick: () => { select(other.id); centerOn(other.id); } },
      kindChip("edges", e.kind), el("span", {}, other.label), e.label ? el("span", { class: "conn-label" }, e.label) : null));
    const incoming = view.edges.filter((e) => e.to === id), outgoing = view.edges.filter((e) => e.from === id);
    const children = [el("div", {}, kindChip("nodes", n.kind), n.step != null ? el("span", { class: "meta" }, `  step ${n.step}`) : null),
      el("div", { class: "card-title" }, n.label), prose("p", "card-summary", n.summary)];
    if (group) children.push(el("span", { class: "loc" }, `${KINDS.groups[group.kind || "file"].label}: ${group.path || group.label}`));
    if (n.source) children.push(sourceLink(n.source), codeBlock(n.source));
    if (incoming.length) children.push(el("h2", {}, "Comes from"), el("ul", { class: "conn-list" }, incoming.map((e) => conn(e, nodes.get(e.from)))));
    if (outgoing.length) children.push(el("h2", {}, "Leads to"), el("ul", { class: "conn-list" }, outgoing.map((e) => conn(e, nodes.get(e.to)))));
    if (n.drill) {
      const target = MODEL.views.find((v) => v.id === n.drill);
      children.push(el("button", { class: "btn drill-btn", onclick: () => openView(n.drill) }, `Open flow: ${target ? target.title : n.drill} ⤵`));
    }
    panel.replaceChildren(...children);
  }
  function select(id) {
    state.selected = id;
    for (const [nid, g] of els.nodes) g.classList.toggle("selected", nid === id);
    const idx = state.tour.indexOf(id);
    if (idx >= 0) state.tourIndex = idx;
    updateTour();
    renderDetails(id);
    restoreFocus();
    writeHash();
  }

  // ---------- legend ----------
  function legendShape(kind) {
    const s = sv("svg", { viewBox: "-4 -6 52 34" });
    s.append(shapeGroup(kind, 44, 22));
    return s;
  }
  function legendLine(kind) {
    const s = sv("svg", { viewBox: "0 0 46 26" });
    s.append(sv("path", { d: "M2,13 H40", ...edgeStyle(kind) }));
    return s;
  }
  function legendGroup(kind) {
    const s = sv("svg", { viewBox: "0 0 46 26" });
    s.append(sv("rect", { class: `group-box ${kind}`, x: 2, y: 3, width: 42, height: 20, rx: 5 }));
    return s;
  }
  function renderLegend(view) {
    const used = (list, key) => [...new Set(list.map((x) => x[key]))];
    const nodeKinds = Object.keys(KINDS.nodes).filter((k) => used(view.nodes, "kind").includes(k));
    const edgeKinds = Object.keys(KINDS.edges).filter((k) => used(view.edges, "kind").includes(k));
    const groupKinds = Object.keys(KINDS.groups).filter((k) => view.groups.some((g) => (g.kind || "file") === k) || (k === "outside" && view.nodes.some((n) => !n.group)));
    const item = (svgNode, spec, onEnter) => el("div", { class: "legend-item", tabindex: 0,
      onpointerenter: onEnter, onpointerleave: () => restoreFocus(), onfocus: onEnter, onblur: () => restoreFocus() },
      svgNode, el("div", {}, el("span", { class: "legend-name" }, spec.label), el("span", { class: "legend-def" }, spec.definition)));
    $("legend").replaceChildren(
      el("h2", {}, "Shapes & colours"),
      ...nodeKinds.map((k) => item(legendShape(k), KINDS.nodes[k], () => lightUp(view.nodes.filter((n) => n.kind === k).map((n) => n.id), () => false))),
      el("h2", {}, "Arrows"),
      ...edgeKinds.map((k) => item(legendLine(k), KINDS.edges[k], () => lightUp(view.edges.filter((e) => e.kind === k).flatMap((e) => [e.from, e.to]), (e) => e.kind === k))),
      el("h2", {}, "Containers"),
      ...groupKinds.map((k) => item(legendGroup(k), KINDS.groups[k], () => lightUp(view.nodes.filter((n) => (k === "outside" ? !n.group : view.groups.find((g) => g.id === n.group && (g.kind || "file") === k))).map((n) => n.id), () => false))),
      el("h2", {}, "Keys"),
      el("div", { class: "keys" }, el("kbd", {}, "←"), " ", el("kbd", {}, "→"), " walk steps · ", el("kbd", {}, "/"), " search · ",
        el("kbd", {}, "f"), " fit · ", el("kbd", {}, "["), " ", el("kbd", {}, "]"), " panels · ", el("kbd", {}, "Esc"), " clear · drag to pan · wheel to zoom"));
  }

  // ---------- tour ----------
  function updateTour() {
    const n = state.tour.length;
    $("tour-label").textContent = n ? `step ${state.tourIndex >= 0 ? state.tourIndex + 1 : "–"}/${n}` : "no steps";
    $("prev").disabled = !n || state.tourIndex <= 0;
    $("next").disabled = !n || state.tourIndex >= n - 1;
  }
  function tourGo(delta) {
    if (!state.tour.length) return;
    const i = Math.max(0, Math.min(state.tour.length - 1, state.tourIndex + delta));
    const id = state.tour[i];
    select(id);
    centerOn(id);
  }
  $("prev").addEventListener("click", () => tourGo(-1));
  $("next").addEventListener("click", () => tourGo(1));

  // ---------- search ----------
  function applySearch(q) {
    q = q.trim().toLowerCase();
    state.match.clear();
    for (const n of state.view.nodes) {
      const hay = [n.label, n.summary, n.source?.path, n.source?.code].join(" ").toLowerCase();
      const on = !!q && hay.includes(q);
      if (on) state.match.add(n.id);
      els.nodes.get(n.id)?.classList.toggle("match", on);
    }
    if (q && state.match.size) lightUp([...state.match], () => false);
    else restoreFocus();
  }
  $("search").addEventListener("input", (e) => applySearch(e.target.value));
  $("search").addEventListener("keydown", (e) => { if (e.key === "Enter" && state.match.size) { const id = [...state.match][0]; select(id); centerOn(id); } });

  // ---------- pan & zoom ----------
  function applyTransform() { viewport.setAttribute("transform", `translate(${state.tx},${state.ty}) scale(${state.k})`); }
  function fit() {
    const L = state.layout, r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    state.k = Math.min(1.2, Math.max(0.2, Math.min(r.width / L.width, r.height / L.height)));
    state.tx = (r.width - L.width * state.k) / 2;
    state.ty = Math.max(0, (r.height - L.height * state.k) / 2);
    applyTransform();
  }
  function zoomAt(factor, cx, cy) {
    const k = Math.min(2.5, Math.max(0.15, state.k * factor));
    state.tx = cx - (cx - state.tx) * (k / state.k);
    state.ty = cy - (cy - state.ty) * (k / state.k);
    state.k = k;
    applyTransform();
  }
  function centerOn(id) {
    const p = state.layout.pos.get(id), r = svg.getBoundingClientRect();
    if (!p) return;
    state.k = Math.max(state.k, 0.8);
    state.tx = r.width / 2 - (p.x + p.w / 2) * state.k;
    state.ty = r.height / 2 - (p.y + p.h / 2) * state.k;
    viewport.style.transition = "transform .25s";
    applyTransform();
    setTimeout(() => (viewport.style.transition = ""), 260);
  }
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  let drag = null;
  svg.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".node")) return;
    drag = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty, moved: false };
    svg.setPointerCapture(e.pointerId);
    svg.classList.add("panning");
  });
  svg.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    state.tx = drag.tx + dx; state.ty = drag.ty + dy;
    applyTransform();
  });
  svg.addEventListener("pointerup", (e) => {
    if (drag && !drag.moved && !e.target.closest(".node, .edge")) { select(null); }
    drag = null; svg.classList.remove("panning");
  });
  const zoomCenter = (f) => { const r = svg.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); };
  $("zoom-in").addEventListener("click", () => zoomCenter(1.25));
  $("zoom-out").addEventListener("click", () => zoomCenter(0.8));
  $("zoom-fit").addEventListener("click", fit);
  window.addEventListener("resize", () => { hideTip(); fit(); });

  // ---------- collapsible side panels ----------
  // Remembered per viewer; storage can be missing or refuse, so every access
  // is guarded and the page works the same without it.
  const PANELS = {
    legend: { side: "left", open: "«", shut: "»", name: "legend", key: "[" },
    details: { side: "right", open: "»", shut: "«", name: "details", key: "]" },
  };
  const storeKey = "onb-collapsed";
  let collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem(storeKey) || "{}") || {}; } catch { collapsed = {}; }
  function setPanel(id, shut, refit = true) {
    const spec = PANELS[id], panel = $(`${id}-panel`), button = $(`${id}-toggle`);
    panel.classList.toggle("collapsed", shut);
    document.querySelector(".body").classList.toggle(`${spec.side}-collapsed`, shut);
    button.textContent = shut ? spec.shut : spec.open;
    button.setAttribute("aria-expanded", String(!shut));
    button.title = `${shut ? "Expand" : "Collapse"} ${spec.name} (${spec.key})`;
    collapsed[id] = shut;
    try { localStorage.setItem(storeKey, JSON.stringify(collapsed)); } catch { /* ignore */ }
    if (refit) requestAnimationFrame(() => { hideTip(); if (state.layout) fit(); });
  }
  for (const id of Object.keys(PANELS)) {
    const panel = $(`${id}-panel`);
    $(`${id}-toggle`).addEventListener("click", (ev) => { ev.stopPropagation(); setPanel(id, !panel.classList.contains("collapsed")); });
    // The whole rail is a target when collapsed, not just the small button.
    panel.querySelector(".panel-head").addEventListener("click", () => { if (panel.classList.contains("collapsed")) setPanel(id, false); });
    setPanel(id, !!collapsed[id], false);
  }

  // ---------- keyboard ----------
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input")) { if (e.key === "Escape") { e.target.value = ""; applySearch(""); e.target.blur(); } return; }
    if (e.key === "ArrowRight") { e.preventDefault(); tourGo(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); tourGo(-1); }
    else if (e.key === "/") { e.preventDefault(); $("search").focus(); }
    else if (e.key === "f") fit();
    else if (e.key === "[") setPanel("legend", !$("legend-panel").classList.contains("collapsed"));
    else if (e.key === "]") setPanel("details", !$("details-panel").classList.contains("collapsed"));
    else if (e.key === "+" || e.key === "=") zoomCenter(1.25);
    else if (e.key === "-") zoomCenter(0.8);
    else if (e.key === "Escape") { hideTip(); select(null); }
  });

  // ---------- views, tabs, deep links ----------
  function writeHash() {
    const params = new URLSearchParams({ v: state.view.id });
    if (state.selected) params.set("n", state.selected);
    // Hosts that sandbox the page may refuse history writes; deep links are a
    // convenience, so a refusal must never break selection.
    try { history.replaceState(null, "", `#${params}`); } catch { /* ignore */ }
  }
  function openView(id, nodeId) {
    const view = MODEL.views.find((v) => v.id === id) || MODEL.views[0];
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.view === view.id)));
    hideTip();
    state.selected = null;
    render(view);
    if (nodeId && view.nodes.some((n) => n.id === nodeId)) { select(nodeId); setTimeout(() => centerOn(nodeId), 30); }
    else writeHash();
  }
  $("title").textContent = MODEL.title;
  document.title = MODEL.title;
  const src = MODEL.source || {};
  $("meta").textContent = [src.repo, src.commit && `@ ${src.commit}`, src.generated && `· ${src.generated}`].filter(Boolean).join(" ");
  $("summary").replaceWith(Object.assign(prose("p", "summary", MODEL.summary), { id: "summary" }));
  const tabs = $("tabs");
  for (const v of MODEL.views) {
    tabs.append(el("button", { class: "tab", role: "tab", "data-view": v.id, "aria-selected": "false", onclick: () => openView(v.id) },
      v.title, el("span", { class: "tab-kind" }, v.kind === "architecture" ? "map" : "flow")));
  }
  markerDefs();
  let initial = new URLSearchParams();
  try { initial = new URLSearchParams(location.hash.slice(1)); } catch { /* ignore */ }
  openView(initial.get("v") || MODEL.views[0].id, initial.get("n"));
})();
</script>
</body>
</html>
