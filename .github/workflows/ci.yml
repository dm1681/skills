name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Validate repository
        run: uv run --frozen python scripts/validate_repo.py
      - name: Run tests
        run: uv run --frozen python -m unittest discover -s tests -v
  posix-launcher:
    name: POSIX launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Smoke test
        run: ./install.sh --list

  windows-uv-launcher:
    name: Windows uv-only launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Confirm Python commands are hidden
        shell: pwsh
        run: |
          $UvDirectory = Split-Path (Get-Command uv).Source
          $env:PATH = "$UvDirectory;$env:SystemRoot\System32"
          foreach ($Command in @("python", "python3", "py")) {
              if (Get-Command $Command -ErrorAction SilentlyContinue) {
                  throw "$Command unexpectedly remains on PATH"
              }
          }
          .\install.ps1 --list
