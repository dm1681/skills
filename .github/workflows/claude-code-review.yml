name: Claude Code Review

# Review every PR that is not a draft: when it is opened or reopened ready,
# marked ready (the Dispatcher opens each Run's PR as a draft), on later pushes
# and on a manual dispatch. Fork PRs, bot-authored PRs and runs a bot triggers
# (Dependabot, Renovate, ...) are skipped: GitHub withholds repository secrets
# from forks and Dependabot, claude-code-action refuses bot actors unless
# listed in allowed_bots, bot code must not run while the token is available,
# and running untrusted code with the token (pull_request_target) is not worth
# the risk. A newer run on the same PR cancels the one still in
# progress, so a stale review is never posted. Claude posts as the Claude
# GitHub App; the implementer triages each comment with a Disposition
# (CONTEXT.md).
#
# The review session is headless: it ends when Claude's turn ends, so a check
# Claude starts in the background is abandoned with no review posted. For a
# repository whose documented check takes more than a minute or two, set the
# Actions variable REVIEW_CHECK to that check's command
# (gh variable set REVIEW_CHECK -R <owner>/<repo> --body '<command>'): the
# "Run the repository's check" step runs it before Claude starts and Claude
# reads its log instead of rerunning it. Leave the variable unset when the
# check is quick. The file itself stays identical to the Dispatcher's template,
# which the onboarding sweep keeps every repository on.
#
# A run that ends without a claude[bot] review on the head commit fails, so
# the Dispatcher shows it instead of a green check with no verdict.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

concurrency:
  group: claude-review-${{ github.event.inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.type != 'Bot' ||
       contains(fromJSON('["olympus-dispatcher[bot]","olympus-reviewer[bot]"]'), github.event.pull_request.user.login)) &&
      (!endsWith(github.actor, '[bot]') ||
       contains(fromJSON('["olympus-dispatcher[bot]","olympus-reviewer[bot]"]'), github.actor)))
    env:
      PR: ${{ github.event.inputs.pr || github.event.pull_request.number }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Require CLAUDE_CODE_OAUTH_TOKEN
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set; without it claude-code-action skips its run steps and reports green having done nothing. Generate it with 'claude setup-token' and store it with: gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${{ github.repository }}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out the pull request head (manual runs start on the default branch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        # The same trust rule as automatic runs: never check out fork or bot code
        # while the token is available.
        run: |
          # a number only: gh also accepts a URL, which could name another repository's PR
          case "$PR" in
            ''|*[!0-9]*) echo "::error::pr must be a pull request number of this repository, got '$PR'"; exit 1 ;;
          esac
          # Same-repository branches only. The Dispatcher's own apps author this repository's
          # PRs (ADR 0004), so they are trusted like the owner; any other bot is not.
          trust=$(gh pr view "$PR" --json isCrossRepository,author --jq '"\(.isCrossRepository) \(.author.login)"')
          case "$trust" in
            "false app/olympus-dispatcher"|"false app/olympus-reviewer"|"false olympus-dispatcher"|"false olympus-reviewer") ;;
            false\ *) author=${trust#false }; isbot=$(gh pr view "$PR" --json author --jq .author.is_bot)
               [ "$isbot" = "false" ] || { echo "::error::PR #$PR is authored by a bot ($author) that is not one of the Dispatcher's apps."; exit 1; } ;;
            *) echo "::error::PR #$PR comes from a fork ($trust); manual reviews run only on this repository's own branches."; exit 1 ;;
          esac
          gh pr checkout "$PR"

      - name: Record the pull request head
        id: head
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        # a pull_request run checks out the merge commit, not the head
        run: echo "sha=${EVENT_HEAD:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Run the repository's check (set REVIEW_CHECK for a slow check)
        if: vars.REVIEW_CHECK != ''
        timeout-minutes: 30
        env:
          REVIEW_CHECK: ${{ vars.REVIEW_CHECK }}
          LOG: ${{ runner.temp }}/review-check.log
        # A failing or timed-out check (exit status 124) is a finding for the review,
        # not a reason to skip it: the limit is enforced here, below the step's
        # timeout-minutes backstop, so the status is recorded and Claude still runs.
        run: |
          status=0
          timeout 25m bash -c "$REVIEW_CHECK" > "$LOG" 2>&1 || status=$?
          echo "exit status $status" >> "$LOG"
          tail -n 20 "$LOG"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "olympus-dispatcher[bot],olympus-reviewer[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR }}
            HEAD SHA: ${{ steps.head.outputs.sha }}
            CHECK LOG: ${{ vars.REVIEW_CHECK != '' && format('{0}/review-check.log', runner.temp) || 'none' }}

            This session is headless: it ends when your turn ends, and nothing
            resumes it. Never start a command in the background to wait for it,
            and never end your turn before your review is posted; a run that ends
            without a review fails.

            Review this pull request as an independent reviewer. The PR body carries
            the Linear issue's acceptance criteria (copied in at claim; this runner has
            no Linear access, so do not try to open Linear); the repository's AGENTS.md,
            CONTEXT.md (glossary) and docs/adr/ define its conventions and settled
            decisions. Judge the diff against those, not against general taste.

            Do:
            - If CHECK LOG above is a path, the workflow already ran the repository's
              check before this session: read that log with `cat` (its last line is the
              exit status), report the result, and do not rerun the check. Otherwise run
              the check the repository documents (AGENTS.md, CLAUDE.md or README) in the
              foreground and report the result. If your tools cannot run it (only
              `python3 -m unittest` is allowed here), say so instead of guessing.
            - Check every acceptance criterion in the linked issue; name any that is
              not met or not tested.
            - Look for real defects: wrong behaviour, races, unhandled failure paths,
              tests that cannot fail, breaches of the repository's documented conventions.
            - Submit this review as APPROVE when you have no findings at this head, or when
              an earlier review of yours requested changes and every point in it is now
              addressed (the Dispatcher's Human Review gate waits for your approval);
              otherwise post ONE review that carries its inline comments, anchored
              to the lines they concern. Use the Write tool to create /tmp/review.json as
              {"commit_id": "<HEAD SHA above>", "event": "COMMENT" | "REQUEST_CHANGES" | "APPROVE",
              "body": "...", "comments": [{"path": ..., "line": N, "side": "RIGHT",
              "body": "..."}]} and post it with
              `gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/reviews --input /tmp/review.json`.
              If that call fails, use the Write tool to write the same text, with the
              inline comments folded in, to /tmp/review.md and post it with
              `gh pr review ${{ env.PR }} --approve|--request-changes|--comment --body-file /tmp/review.md`,
              choosing the flag that matches your verdict (file:line references
              in the text). Never downgrade an approval or a change request to a plain
              comment: the PR's review decision is what the Dispatcher reads. A review
              MUST be posted on every run; a run that ends without one has failed its job.
              Tool permissions here match command prefixes, so every `gh api` call
              must start with the endpoint path (`gh api repos/... [flags]`), never
              with flags such as `-X`, `--method` or `--paginate` before it.
              Each comment states the evidence (what you ran or read) and a concrete fix.

            Do not: restate the diff, comment on style, or post a comment for anything
            you did not verify. An empty review ("no findings") is a valid outcome; say
            so in one sentence.

          # Claude Code matches a Bash allow-rule's prefix on whole words, so
          # `gh api repos/<repo>/pulls/:*` never matches `pulls/<n>/reviews`: each
          # path this PR's review reads or posts is named with the number in it.
          # Do not shorten them back to one `pulls/` rule.
          claude_args: |
            --model opus
            --effort high
            --allowed-tools "Write,Read,Glob,Grep,Bash(python3 -m unittest:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ env.PR }}:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/reviews:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/comments:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/files:*),Bash(gh api graphql:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git diff:*),Bash(cat:*),Bash(mktemp:*)"

      # claude-code-action skips itself, with a successful step and no
      # `conclusion` output, on a PR that edits this workflow file: its token
      # exchange requires the file to match the default branch. Such a run cannot
      # post a review, so it is explained rather than failed.
      - name: Explain a skipped review (this PR changes the review workflow)
        if: steps.claude-review.outputs.conclusion == ''
        run: echo "::notice::claude-code-action skipped this PR because it changes .github/workflows/claude-code-review.yml; the review runs once that change is on the default branch."

      - name: Require a claude[bot] review on the head commit
        if: steps.claude-review.outputs.conclusion != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          reviews=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .commit_id == \"$HEAD_SHA\")] | length" \
            | awk '{ n += $1 } END { print n + 0 }')
          if [ "$reviews" -eq 0 ]; then
            echo "::error::Claude ended without posting a review on $HEAD_SHA; rerun the review (gh workflow run claude-code-review.yml -f pr=$PR)."
            exit 1
          fi
          echo "claude[bot] posted $reviews review(s) on $HEAD_SHA"
